<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Copilot</title>
<style>
  :root { --ink:#0b1f3a; --blue:#0070e0; --line:#d9e1ec; --bg:#f5f8fc; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:#4a5d78; }
  textarea { width:100%; min-height:110px; padding:12px; border:1px solid var(--line); border-radius:8px; font:inherit; resize:vertical; }
  button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--ink); }
  button:disabled { opacity:.5; cursor:default; }
  .card { margin-top:24px; padding:20px; background:#fff; border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:8px 4px; text-align:left; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; }
  .total td { font-weight:700; border-bottom:0; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; background:#eef5ff; }
  .err { background:#fdecec; color:#8a1c1c; }
  pre { overflow:auto; padding:12px; background:#0b1f3a; color:#d7e6ff; border-radius:8px; font-size:13px; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <h1>Invoice Copilot</h1>
  <p class="sub">Describe the job in plain English. Get an invoice and a PayPal sandbox checkout.</p>

  <label for="job">Job description</label>
  <textarea id="job">Built a 5-page website for Acme Bakery, 12 hours at $50/hour, plus logo design $150 flat, 6% tax, due in 14 days</textarea>
  <button id="draft">Draft invoice</button>

  <div id="error" class="msg err" hidden></div>

  <section id="invoice" class="card" hidden>
    <h2 id="client"></h2>
    <table>
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="due"></p>
    <p id="source" class="sub"></p>
    <button id="pay" class="secondary">Create PayPal sandbox checkout</button>
    <div id="checkout" class="msg" hidden></div>
    <pre id="payload" hidden></pre>
  </section>
</main>
<script>
(function () {
  var current = null;
  var $ = function (id) { return document.getElementById(id); };
  var money = function (c) { return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

  function showError(msg) { var e = $('error'); e.textContent = msg; e.hidden = !msg; }

  function cell(tag, text, cls) { var c = document.createElement(tag); c.textContent = text; if (cls) c.className = cls; return c; }

  function render(data) {
    current = data.invoice;
    $('client').textContent = 'Invoice for ' + data.invoice.client;
    var body = $('rows');
    body.textContent = '';
    data.invoice.items.forEach(function (it, i) {
      var tr = document.createElement('tr');
      tr.appendChild(cell('td', it.description));
      tr.appendChild(cell('td', String(it.quantity), 'num'));
      tr.appendChild(cell('td', money(it.unitCents), 'num'));
      tr.appendChild(cell('td', money(data.totals.lines[i]), 'num'));
      body.appendChild(tr);
    });
    [['Subtotal', data.totals.subtotalCents], ['Tax (' + data.invoice.taxPercent + '%)', data.totals.taxCents], ['Total', data.totals.totalCents]].forEach(function (r, i) {
      var tr = document.createElement('tr');
      if (i === 2) tr.className = 'total';
      tr.appendChild(cell('td', r[0]));
      tr.appendChild(cell('td', ''));
      tr.appendChild(cell('td', ''));
      tr.appendChild(cell('td', money(r[1]), 'num'));
      body.appendChild(tr);
    });
    $('due').textContent = 'Due in ' + data.invoice.dueDays + ' days';
    $('source').textContent = (data.source === 'llm' ? 'Drafted by the AI step.' : 'Drafted by the built-in parser.') + (data.note ? ' ' + data.note : '');
    $('checkout').hidden = true;
    $('payload').hidden = true;
    $('invoice').hidden = false;
  }

  async function post(url, body) {
    var res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed.');
    return data;
  }

  $('draft').addEventListener('click', async function () {
    showError('');
    $('draft').disabled = true;
    try { render(await post('/api/invoice', { text: $('job').value })); }
    catch (e) { showError(e.message); $('invoice').hidden = true; }
    finally { $('draft').disabled = false; }
  });

  $('pay').addEventListener('click', async function () {
    showError('');
    $('pay').disabled = true;
    try {
      var r = await post('/api/checkout', { invoice: current });
      var box = $('checkout');
      box.textContent = '';
      if (r.configured && r.approveUrl) {
        box.appendChild(document.createTextNode('Sandbox order ' + r.id + ' (' + r.status + '). '));
        var a = document.createElement('a');
        a.href = r.approveUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open PayPal sandbox checkout';
        box.appendChild(a);
        $('payload').hidden = true;
      } else {
        box.textContent = r.message || 'Order created.';
        $('payload').textContent = JSON.stringify(r.payload, null, 2);
        $('payload').hidden = false;
      }
      box.hidden = false;
    } catch (e) { showError(e.message); }
    finally { $('pay').disabled = false; }
  });
})();
</script>
</body>
</html>
